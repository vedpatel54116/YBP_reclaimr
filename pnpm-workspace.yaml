packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 blocks dependency install scripts by default. These dependencies
# need their scripts to fetch/set up platform binaries:
# - esbuild, sharp: native binaries (tsup/tsx and Next.js image optimization)
# - unrs-resolver: native resolver used by eslint-import-resolver-typescript
# - @prisma/client, @prisma/engines, prisma: Prisma CLI + query engine binaries
# - msgpackr-extract: optional native accelerator for BullMQ's msgpackr dep
allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  msgpackr-extract: true
