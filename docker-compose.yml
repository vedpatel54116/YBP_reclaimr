# Local development infrastructure: PostgreSQL + Redis.
# Production runs managed services (RDS / ElastiCache); this file is for `pnpm dev`.
#
#   docker compose up -d      # start
#   docker compose down       # stop (add -v to also wipe data)

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reclaimr
      POSTGRES_PASSWORD: reclaimr
      POSTGRES_DB: reclaimr
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reclaimr -d reclaimr"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
